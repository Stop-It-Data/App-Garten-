name: Webseite veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Webseite auspacken
        run: |
          mkdir _site
          unzip -q webseite.zip -d _site
          if [ ! -f _site/index.html ] && [ "$(ls _site | wc -l)" = "1" ]; then
            d="_site/$(ls _site)"; mv "$d"/* "$d"/.[!.]* _site/ 2>/dev/null || true; rmdir "$d"
          fi
          rm -rf _site/__MACOSX
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

